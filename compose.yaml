services:
  valkey:
    image: valkey/valkey:9
    ports:
      - "6379:6379"

  valuator1:
    build: ./Valuator
    volumes:
      - dpkeys:/keys
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Redis: "valkey:6379"
    depends_on:
      - valkey

  valuator2:
    build: ./Valuator
    volumes:
      - dpkeys:/keys
    ports:
      - "8081:8081"
    environment:
      ASPNETCORE_URLS: "http://+:8081"
      ConnectionStrings__Redis: "valkey:6379"
    depends_on:
      - valkey

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - valuator1
      - valuator2

volumes:
  dpkeys: