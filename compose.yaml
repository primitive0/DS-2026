x-app-environment: &app-environment
  ConnectionStrings__Redis: "valkey:6379,abortConnect=false"
  RabbitMQ__HostName: rabbitmq
  RabbitMQ__UserName: student
  RabbitMQ__Password: student

x-app-dependencies: &app-dependencies
  valkey:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  valkey:
    image: valkey/valkey:9
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: student
      RABBITMQ_DEFAULT_PASS: student
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  valuator:
    build:
      context: .
      dockerfile: Valuator/Dockerfile
    scale: 2
    environment:
      <<: *app-environment
      ASPNETCORE_URLS: "http://+:8080"
    volumes:
      - dpkeys:/keys
    depends_on: *app-dependencies
    restart: unless-stopped

  rankcalculator:
    build:
      context: .
      dockerfile: RankCalculator/Dockerfile
    scale: 2
    environment:
      <<: *app-environment
      ProcessingDelayMilliseconds: "${RANK_DELAY_MS:-0}"
    depends_on: *app-dependencies
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      valuator:
        condition: service_started
    restart: unless-stopped

volumes:
  dpkeys:
  valkey-data:
  rabbitmq-data:
