<svg xmlns="http://www.w3.org/2000/svg" width="1365" height="1000" viewBox="0 0 1365 1000">
<title>PA3 — C4: диаграмма контейнеров</title>
<desc>Браузер обращается к Nginx, который балансирует два Valuator. Valuator сохраняет текст и similarity в Valkey и отправляет задания в RabbitMQ. Два RankCalculator конкурируют за задания и сохраняют rank в Valkey.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#374151"/></marker></defs>
<rect width="1365" height="1000" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#111827">
<text x="45" y="45" font-size="26" font-weight="bold">PA3 — C4: диаграмма контейнеров</text>
<rect x="40" y="320" width="1285" height="540" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5"/>
<text x="60" y="345" font-size="17" font-weight="bold">Система оценки текста [Docker Compose]</text>
<path d="M215,230 L215,365" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="75.0" y="268.0" width="280" height="50" fill="#f8fafc" rx="3"/>
<text x="215" y="289.0" text-anchor="middle" font-size="14">HTTP :8080</text>
<text x="215" y="308.0" text-anchor="middle" font-size="14">Форма, POST и результат</text>
<path d="M355,438 L550,438" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="302.0" y="390.0" width="300" height="50" fill="#f8fafc" rx="3"/>
<text x="452" y="411.0" text-anchor="middle" font-size="14">HTTP :8080</text>
<text x="452" y="430.0" text-anchor="middle" font-size="14">Балансировка между репликами</text>
<path d="M830,438 L1010,438" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="810.0" y="380.5" width="220" height="69" fill="#f8fafc" rx="3"/>
<text x="920" y="401.5" text-anchor="middle" font-size="14">RESP / TCP :6379</text>
<text x="920" y="420.5" text-anchor="middle" font-size="14">Запись текста и similarity;</text>
<text x="920" y="439.5" text-anchor="middle" font-size="14">чтение результатов</text>
<path d="M690,510 L690,655" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="545.0" y="558.0" width="290" height="50" fill="#f8fafc" rx="3"/>
<text x="690" y="579.0" text-anchor="middle" font-size="14">AMQP 0-9-1 :5672</text>
<text x="690" y="598.0" text-anchor="middle" font-size="14">CalculateRank { TextId }</text>
<path d="M830,727 L1010,727" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="795.0" y="664.5" width="250" height="69" fill="#f8fafc" rx="3"/>
<text x="920" y="685.5" text-anchor="middle" font-size="14">AMQP 0-9-1 :5672</text>
<text x="920" y="704.5" text-anchor="middle" font-size="14">Задание → потребитель;</text>
<text x="920" y="723.5" text-anchor="middle" font-size="14">подтверждение ←</text>
<path d="M1150,655 L1150,510" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1025.0" y="548.5" width="250" height="69" fill="#f8fafc" rx="3"/>
<text x="1150" y="569.5" text-anchor="middle" font-size="14">RESP / TCP :6379</text>
<text x="1150" y="588.5" text-anchor="middle" font-size="14">Чтение текста;</text>
<text x="1150" y="607.5" text-anchor="middle" font-size="14">запись rank</text>
<rect x="75" y="95" width="280" height="135" rx="8" fill="#6b7280" stroke="#0b4884" stroke-width="1.5"/>
<text x="215.0" y="129" fill="white" text-anchor="middle" font-size="21" font-weight="bold">Браузер пользователя</text>
<text x="215.0" y="154" fill="white" text-anchor="middle" font-size="13" font-weight="normal">[Клиент: HTML / HTTP]</text>
<text x="215.0" y="179" fill="white" text-anchor="middle" font-size="13" font-weight="normal">Ввод текста и просмотр результата</text>
<rect x="75" y="365" width="280" height="145" rx="8" fill="#1168bd" stroke="#0b4884" stroke-width="1.5"/>
<text x="215.0" y="399" fill="white" text-anchor="middle" font-size="21" font-weight="bold">Nginx × 1</text>
<text x="215.0" y="424" fill="white" text-anchor="middle" font-size="13" font-weight="normal">[Контейнер: Nginx 1.28]</text>
<text x="215.0" y="449" fill="white" text-anchor="middle" font-size="13" font-weight="normal">Балансировка HTTP-запросов</text>
<text x="215.0" y="474" fill="white" text-anchor="middle" font-size="13" font-weight="normal">Обновление адресов через Docker DNS</text>
<rect x="550" y="365" width="280" height="145" rx="8" fill="#1168bd" stroke="#0b4884" stroke-width="1.5"/>
<text x="690.0" y="399" fill="white" text-anchor="middle" font-size="21" font-weight="bold">Valuator × 2</text>
<text x="690.0" y="424" fill="white" text-anchor="middle" font-size="13" font-weight="normal">[Контейнер: ASP.NET Core 10]</text>
<text x="690.0" y="449" fill="white" text-anchor="middle" font-size="13" font-weight="normal">Сохранение текста и similarity</text>
<text x="690.0" y="474" fill="white" text-anchor="middle" font-size="13" font-weight="normal">Публикация задания; страница результата</text>
<rect x="550" y="655" width="280" height="145" rx="8" fill="#1168bd" stroke="#0b4884" stroke-width="1.5"/>
<text x="690.0" y="689" fill="white" text-anchor="middle" font-size="21" font-weight="bold">RabbitMQ × 1</text>
<text x="690.0" y="714" fill="white" text-anchor="middle" font-size="13" font-weight="normal">[Контейнер: RabbitMQ 4]</text>
<text x="690.0" y="739" fill="white" text-anchor="middle" font-size="13" font-weight="normal">Устойчивая очередь rank-tasks</text>
<text x="690.0" y="764" fill="white" text-anchor="middle" font-size="13" font-weight="normal">Сохраняемые сообщения и publisher confirms</text>
<rect x="1010" y="655" width="280" height="145" rx="8" fill="#1168bd" stroke="#0b4884" stroke-width="1.5"/>
<text x="1150.0" y="689" fill="white" text-anchor="middle" font-size="21" font-weight="bold">RankCalculator × 2</text>
<text x="1150.0" y="714" fill="white" text-anchor="middle" font-size="13" font-weight="normal">[Контейнер: .NET 10]</text>
<text x="1150.0" y="739" fill="white" text-anchor="middle" font-size="13" font-weight="normal">Конкурирующие потребители</text>
<text x="1150.0" y="764" fill="white" text-anchor="middle" font-size="13" font-weight="normal">prefetch=1; ack после записи rank</text>
<rect x="1010" y="365" width="280" height="145" rx="8" fill="#1168bd" stroke="#0b4884" stroke-width="1.5"/>
<text x="1150.0" y="399" fill="white" text-anchor="middle" font-size="21" font-weight="bold">Valkey × 1</text>
<text x="1150.0" y="424" fill="white" text-anchor="middle" font-size="13" font-weight="normal">[Контейнер: Valkey 9]</text>
<text x="1150.0" y="449" fill="white" text-anchor="middle" font-size="13" font-weight="normal">TEXT-{id}, RANK-{id}</text>
<text x="1150.0" y="474" fill="white" text-anchor="middle" font-size="13" font-weight="normal">SIMILARITY-{id}, SEEN-{hash}; AOF</text>
<text x="75" y="885" font-size="15">Общие тома: dpkeys — ключи ASP.NET; valkey-data — данные Valkey; rabbitmq-data — данные RabbitMQ.</text>
<text x="75" y="915" font-size="15">RabbitMQ Management: HTTP :15672. Реплики приложений не публикуют внешние порты.</text>
<text x="75" y="945" font-size="15">Количество экземпляров указано для запуска по умолчанию; масштабирование — docker compose up --scale.</text>
</g></svg>
